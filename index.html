<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 12h-4l-3 9L9 3l-3 9H2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MEDX BD — Interactive Medical Simulation & Learning Platform</title>
    <meta name="description" content="Next-generation interactive medical education, 3D anatomy, physiology simulation, OSPE/OSCE training, and virtual patient cases for Bangladesh MBBS students." />
    
    <!-- Google Fonts: Inter, Source Serif 4, Noto Sans Bengali & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;0,8..60,800;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#06172E] text-[#F5F9FF] font-sans antialiased selection:bg-[#08AFC1]/30 selection:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script>
      function shouldIgnoreError(msg) {
        if (!msg) return true;
        var text = String(msg).toLowerCase();
        return text.indexOf('<!doctype') !== -1 || 
               text.indexOf('unexpected token \'<\'') !== -1 || 
               text.indexOf('unexpected token <') !== -1 || 
               text.indexOf('is not valid json') !== -1 ||
               text.indexOf('failed to fetch') !== -1 ||
               text.indexOf('networkerror') !== -1;
      }

      window.addEventListener('error', function(e) {
        var msg = e.error ? e.error.message : e.message;
        if (shouldIgnoreError(msg)) {
          console.warn('MedX gracefully handled runtime notice:', msg);
          return;
        }
        var box = document.getElementById('runtime-error-overlay');
        if (!box) {
          box = document.createElement('div');
          box.id = 'runtime-error-overlay';
          box.style.cssText = 'position:fixed;bottom:16px;right:16px;max-width:480px;z-index:999999;background:#881337;color:#fecdd3;padding:16px;border-radius:12px;font-family:monospace;font-size:12px;border:1px solid #f43f5e;box-shadow:0 10px 25px rgba(0,0,0,0.5);';
          document.body.appendChild(box);
        }
        box.innerHTML = '<strong>App Notice:</strong><div style="margin-top:6px;word-break:break-all;">' + msg + '</div>';
      });

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled rejection';
        if (shouldIgnoreError(reason)) {
          console.warn('MedX safely handled promise notice:', reason);
          e.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
